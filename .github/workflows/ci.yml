name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # The interop suite is the real proof: it drives our server with the
      # genuine redis-cli and asserts byte-level protocol compatibility.
      - name: Install real Redis (for interop)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y redis-tools redis-server
          else
            brew install redis
          fi

      - name: Interop tests against real redis-cli
        run: ./scripts/interop_test.sh

      # The strongest check available: identical command sequences are run
      # against mnemos and a real redis-server, and every reply is compared.
      - name: Differential test against real redis-server
        run: ./scripts/differential_test.sh

      # mnemos-mcp is a RESP client, so the same tool calls run against a real
      # redis-server and the JSON is compared -- an oracle for everything but
      # the JSON-RPC framing, which the same suite checks directly.
      - name: MCP tests
        run: python3 ./scripts/mcp_test.py

  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure with sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMNEMOS_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit tests under sanitizers
        run: ctest --test-dir build --output-on-failure
