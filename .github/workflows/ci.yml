name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build -j

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # The interop suite is the real proof: it drives our server with the
      # genuine redis-cli and asserts byte-level protocol compatibility.
      - name: Install real Redis (for interop)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y redis-tools redis-server
          else
            brew install redis
          fi

      - name: Interop tests against real redis-cli
        run: ./scripts/interop_test.sh

      # The strongest check available: identical command sequences are run
      # against mnemos and a real redis-server, and every reply is compared.
      - name: Differential test against real redis-server
        run: ./scripts/differential_test.sh

      # mnemos-mcp is a RESP client, so the same tool calls run against a real
      # redis-server and the JSON is compared -- an oracle for everything but
      # the JSON-RPC framing, which the same suite checks directly.
      - name: MCP tests
        run: python3 ./scripts/mcp_test.py

      # No oracle here: a reference broker is a JVM. The suite is a second
      # implementation of the Kafka protocol, written from the spec, driving a
      # real socket against mnemos-kafka.
      - name: Kafka tests
        run: python3 ./scripts/kafka_test.py

  # The image, built and driven by clients from their own images. kcat is
  # librdkafka, so this is also the one Kafka client in CI that was not
  # written in this repo -- pinned by image tag, so it cannot drift.
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start
        run: docker compose up -d --build --wait

      - name: redis-cli against the container
        run: |
          test "$(docker compose run --rm -T redis-cli PING)" = PONG
          docker compose run --rm -T redis-cli SET greeting hello
          test "$(docker compose run --rm -T redis-cli GET greeting)" = hello

      - name: kcat produce and consume
        run: |
          echo "hello from kcat" | docker compose run --rm -T kcat -P -t smoke -p 0
          test "$(docker compose run --rm -T kcat -C -t smoke -p 0 -o beginning -e -q)" = "hello from kcat"

      - name: Persistence across a restart
        run: |
          docker compose run --rm -T redis-cli SAVE
          docker compose restart mnemos
          docker compose up -d --wait
          test "$(docker compose run --rm -T redis-cli GET greeting)" = hello

      - name: Logs
        if: failure()
        run: docker compose logs

  sanitizers:
    name: asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure with sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMNEMOS_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Unit tests under sanitizers
        run: ctest --test-dir build --output-on-failure
